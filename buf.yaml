version: v2
modules:
  - path: proto
    name: buf.build/ttm/messenger-protocol
lint:
  use:
    - STANDARD
  ignore_only:
    RPC_REQUEST_STANDARD_NAME:
      - proto/ttm/services/notification/v1/notify.proto
      - proto/ttm/services/notification/v2/notify.proto
      - proto/ttm/services/notification/v3/notify.proto
  rpc_allow_google_protobuf_empty_responses: true
breaking:
  use:
    - FILE
  ignore_unstable_packages: true
deps:
  - buf.build/bufbuild/protovalidate
