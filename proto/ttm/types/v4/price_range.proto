syntax = "proto3";

package ttm.types.v4;

import "buf/validate/validate.proto";
import "ttm/types/v4/price.proto";

// Represents a range for a price, defined by a minimum and a maximum value.
//
//
message PriceRange {
  ttm.types.v4.Price min = 1 [(buf.validate.field).required = true];
  ttm.types.v4.Price max = 2 [(buf.validate.field).required = true];

  option (buf.validate.message) = {
    cel: {
      id: "same_currency_required"
      message: "min and max prices must use the same currency"
      expression: "this.min.currency == this.max.currency"
    }
  };
}
