syntax = "proto3";

package ttm.types.v3;

import "ttm/types/v3/evm_address.proto";

// Token Reference
//
//
message TokenCurrency {
  ttm.types.v3.EVMAddress contract_address = 1;
}

// Booking token that represents to access to the service
message Token {
  // Contract address of the smart contract or the address of natively implemented
  // asset on-chain.
  ttm.types.v3.EVMAddress contract = 1;

  // Token ID
  uint64 token_id = 2;
}
