syntax = "proto3";

package ttm.types.v3;

import "ttm/types/v1/credit_card.proto";

// Additional payment info message with currently only a single field of
// `CreditCard` message type.
//
//
message AdditionalPaymentInfo {
  ttm.types.v1.CreditCard credit_card = 1;
}

// Payment Types
enum PaymentType {
  PAYMENT_TYPE_UNSPECIFIED = 0;
  PAYMENT_TYPE_OTHER = 1;
  PAYMENT_TYPE_BANK_TRANSFER = 2;
  PAYMENT_TYPE_CREDIT_CARD = 3;
  PAYMENT_TYPE_PAYPAL = 4;
  PAYMENT_TYPE_CRYPTO_CARD = 5;
}

message OffChainPayment {
  // Payment ID
  string payment_id = 1;

  // Payment Type. It can be Bank transfer, Credit card, ... etc
  ttm.types.v3.PaymentType payment_type = 2;
}
