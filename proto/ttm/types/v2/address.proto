syntax = "proto3";

package ttm.types.v2;

import "ttm/types/v2/location.proto";

// This type represents an address for places like a home or hotel etc.
//
message Address {
  string line_1 = 1;
  string line_2 = 2;
  string district = 3;
  string zip_code = 5;
  ttm.types.v2.GeoTree geo_tree = 6;
}
