syntax = "proto3";

package ttm.services.accommodation.v5;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "ttm/services/accommodation/v5/property_types.proto";
import "ttm/types/v4/common.proto";

// Request a list of modified accommodations.
message AccommodationProductShortListRequest {
  // Common request header used in every request.
  ttm.types.v4.RequestHeader header = 1 [(buf.validate.field).required = true];

  // Only respond with the products that are modified after this timestamp
  //
  // The "modified_after" parameter is used to identify updated products from
  // Suppliers.
  google.protobuf.Timestamp modified_after = 2;
}

message AccommodationProductShortListSuccessResponse {
  // Common response header used in every successful response.
  ttm.types.v4.SuccessResponseHeader header = 1 [(buf.validate.field).required = true];

  // Supplier codes and status for the products that are modified after the timestamp
  // in the `AccommodationProductShortListRequest`. If there are no changes, the list
  // will be empty.
  repeated ttm.services.accommodation.v5.PropertyShortListItem property_short_list_items = 2;
}

message AccommodationProductShortListErrorResponse {
  // Common error response header used in every error response.
  ttm.types.v4.ErrorResponseHeader header = 1 [(buf.validate.field).required = true];
}

// Respond a list of modified accommodations.
message AccommodationProductShortListResponse {
  oneof response {
    option (buf.validate.oneof).required = true; // One must be provided
    ttm.services.accommodation.v5.AccommodationProductShortListSuccessResponse success_response = 1;
    ttm.services.accommodation.v5.AccommodationProductShortListErrorResponse error_response = 2;
  }
}

// Accommodation product short list service definition. This is an alternative
// to `AccommodationProductListService`.
//
/// @custom:ttm-service type:product routing:p2p on-chain:false structure:2
service AccommodationProductShortListService {
  // Returns product list for accommodation (properties) with only supplier codes.
  // This can then be used to identify new or updated properties for mapping purposes.
  rpc AccommodationProductShortList(AccommodationProductShortListRequest) returns (AccommodationProductShortListResponse);
}
