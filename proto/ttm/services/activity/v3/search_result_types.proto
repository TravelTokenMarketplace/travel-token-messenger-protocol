syntax = "proto3";

package ttm.services.activity.v3;

import "ttm/services/activity/v3/activity_types.proto";
import "ttm/types/v1/datetime_range.proto";
import "ttm/types/v1/price_type.proto";
import "ttm/types/v3/price.proto";

// This type represents a search result and is used in the `ActivitySearchResponse`
// message.
//
//
message ActivitySearchResult {
  // Option ID for the search option. This is an increasing number starting at 0 and
  // increasing by 1 for every search result.
  int32 result_id = 1;

  // Activity basic info
  ttm.services.activity.v3.Activity info = 2;

  // Schedule
  ttm.types.v1.DateTimeRange schedule = 3;

  // Activity location
  ttm.services.activity.v3.ActivityLocation location = 4;

  // Pickup Dropoff
  repeated ttm.services.activity.v3.PickupDropoffEvent pickup_dropoff_events = 5;

  // Min participants
  int32 min_participants = 6;

  // Max participants
  int32 max_participants = 7;

  // Price with value and currency code
  ttm.types.v3.Price price = 8;

  // Pricing type
  // Ex: "PerPerson", "PerGroup"
  ttm.types.v1.ChargeType charge_type = 9;
}
