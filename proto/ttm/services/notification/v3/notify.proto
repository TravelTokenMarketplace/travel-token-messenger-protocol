syntax = "proto3";

package ttm.services.notification.v3;

import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";
import "ttm/services/cancellation/v1/reason.proto";
import "ttm/types/v4/evm_address.proto";
import "ttm/types/v4/evm_transaction.proto";
import "ttm/types/v4/uuid.proto";

// Notification service for different events that the partner should be notified about
//
//
//
/// @custom:ttm-service type:product routing:local on-chain:true
service NotificationService {
  rpc TokenBoughtNotification(TokenBought) returns (google.protobuf.Empty);
  rpc TokenReservationExpiredNotification(TokenReservationExpired) returns (google.protobuf.Empty);
  rpc CancellationPendingNotification(CancellationPending) returns (google.protobuf.Empty);
  rpc CancellationWithdrawnNotification(CancellationWithdrawn) returns (google.protobuf.Empty);
  rpc CancellationRejectedNotification(CancellationRejected) returns (google.protobuf.Empty);
  rpc CancellationFinalizedNotification(CancellationFinalized) returns (google.protobuf.Empty);
}

// Related on-chain event:
//
// ```solidity
// event TokenBought(uint256 indexed tokenId, address indexed buyer);
// ```
message TokenBought {
  uint64 token_id = 1;
  ttm.types.v4.EVMTransactionID tx_id = 2;
  ttm.types.v4.UUID mint_id = 3 [(buf.validate.field).required = true];
}

// Related on-chain event:
//
// ```solidity
// event TokenReservationExpired(uint256 indexed tokenId);
// ```
message TokenReservationExpired {
  uint64 token_id = 1;
  ttm.types.v4.EVMTransactionID tx_id = 2;
  ttm.types.v4.UUID mint_id = 3 [(buf.validate.field).required = true];
}

// Related on-chain events:
//
// ```solidity
// event CancellationPending(
//   uint256 indexed tokenId,
//   address indexed initialProposer,
//   address indexed currentProposer,
//   uint256 refundAmount,
//   bool ownerAccepted,
//   bool supplierAccepted,
//   uint32 timesCountered,
//   uint32 timesRejected
// );
//
// event CancellationReasons(
//   uint256 indexed tokenId,
//   uint16 cancellationReason,
//   uint16 cancellationReasonVersion,
//   uint16 rejectionReason,
//   uint16 rejectionVersion,
//   uint16 counterReason,
//   uint16 counterVersion,
//   uint16 withdrawalReason,
//   uint16 withdrawalVersion
// );
// ```
message CancellationPending {
  uint64 token_id = 1;
  ttm.types.v4.EVMAddress initial_proposer = 2 [(buf.validate.field).required = true];
  ttm.types.v4.EVMAddress current_proposer = 3 [(buf.validate.field).required = true];
  uint64 refund_amount = 4;
  bool owner_accepted = 5;
  bool supplier_accepted = 6;
  uint64 times_countered = 7;
  uint64 times_rejected = 8;

  ttm.types.v4.EVMTransactionID tx_id = 9 [(buf.validate.field).required = true];

  // Reasons
  ttm.services.cancellation.v1.CancellationReason cancellation_reason = 10 [(buf.validate.field).enum.defined_only = true];
  ttm.services.cancellation.v1.RejectionReason rejection_reason = 11 [(buf.validate.field).enum.defined_only = true];
  ttm.services.cancellation.v1.CounterReason counter_reason = 12 [(buf.validate.field).enum.defined_only = true];
  ttm.services.cancellation.v1.WithdrawalReason withdrawal_reason = 13 [(buf.validate.field).enum.defined_only = true];
}

// Related on-chain event:
//
// ```solidity
// event CancellationWithdrawn(uint256 indexed tokenId, uint16 withdrawalReason, uint16 withdrawalVersion);
// ```
message CancellationWithdrawn {
  uint64 token_id = 1;
  ttm.services.cancellation.v1.WithdrawalReason reason = 2 [(buf.validate.field).enum.defined_only = true];
  ttm.types.v4.EVMTransactionID tx_id = 3 [(buf.validate.field).required = true];
}

// Related on-chain event:
//
// ```solidity
// event CancellationRejected(uint256 indexed tokenId, uint16 rejectionReason, uint16 rejectionVersion);
// ```
message CancellationRejected {
  uint64 token_id = 1;
  ttm.services.cancellation.v1.RejectionReason reason = 2 [(buf.validate.field).enum.defined_only = true];
  ttm.types.v4.EVMTransactionID tx_id = 3 [(buf.validate.field).required = true];
}

// Related on-chain event:
//
// ```solidity
// event CancellationFinalized(uint256 indexed tokenId);
// ```
message CancellationFinalized {
  uint64 token_id = 1;
  ttm.types.v4.EVMTransactionID tx_id = 2 [(buf.validate.field).required = true];
}
