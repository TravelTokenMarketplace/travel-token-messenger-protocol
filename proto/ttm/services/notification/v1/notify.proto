syntax = "proto3";

package ttm.services.notification.v1;

import "google/protobuf/empty.proto";
import "ttm/types/v1/uuid.proto";

message TokenBought {
  uint64 token_id = 1;
  string tx_id = 2;
  ttm.types.v1.UUID mint_id = 3;
}

message TokenExpired {
  uint64 token_id = 1;
  ttm.types.v1.UUID mint_id = 2;
}

// Notification service for different events that the partner should be notified about
//
/// @custom:ttm-service type:product routing:local on-chain:true
service NotificationService {
  rpc TokenBoughtNotification(TokenBought) returns (google.protobuf.Empty);
  rpc TokenExpiredNotification(TokenExpired) returns (google.protobuf.Empty);
}
