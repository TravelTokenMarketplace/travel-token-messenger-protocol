syntax = "proto3";

package ttm.services.insurance.v3;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "ttm/services/insurance/v3/insurance_types.proto";
import "ttm/types/v4/common.proto";

message InsuranceProductListRequest {
  // Message header
  ttm.types.v4.RequestHeader header = 1 [(buf.validate.field).required = true];

  // Only respond with the products that are modified after this timestamp
  //
  // Timestamps may be used for both off-chain and on-chain operations.
  // For on-chain operations, only seconds are supported, and nanoseconds
  // will be ignored.
  google.protobuf.Timestamp modified_after = 2;
}

message InsuranceProductListSuccessResponse {
  // Message header
  ttm.types.v4.SuccessResponseHeader header = 1 [(buf.validate.field).required = true];

  // Product list: Insurance
  repeated ttm.services.insurance.v3.Insurance insurances = 2 [(buf.validate.field).repeated = {
    min_items: 0
    max_items: 100
  }];
}

message InsuranceProductListErrorResponse {
  // Common error response header used in every error response.
  ttm.types.v4.ErrorResponseHeader header = 1 [(buf.validate.field).required = true];
}

message InsuranceProductListResponse {
  oneof response {
    option (buf.validate.oneof).required = true; // One must be provided
    ttm.services.insurance.v3.InsuranceProductListSuccessResponse success_response = 1;
    ttm.services.insurance.v3.InsuranceProductListErrorResponse error_response = 2;
  }
}

// This service is used to get a product list for insurances.
//
// ![Diagram](https://storage.googleapis.com/docs-cmp-files/diagrams/proto/cmp/services/insurance/v3/list.proto.dot.xs.svg)
//
// [Open Message Diagram](https://storage.googleapis.com/docs-cmp-files/diagrams/proto/cmp/services/insurance/v3/list.proto.dot.svg)
//
/// @custom:ttm-service type:product routing:p2p on-chain:false structure:2
service InsuranceProductListService {
  // Gets an optional `modified_after` date and returns a product list.
  rpc InsuranceProductList(InsuranceProductListRequest) returns (InsuranceProductListResponse);
}
