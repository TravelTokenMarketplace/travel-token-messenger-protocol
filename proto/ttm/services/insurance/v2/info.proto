syntax = "proto3";

package ttm.services.insurance.v2;

import "google/protobuf/timestamp.proto";
import "ttm/services/insurance/v2/insurance_types.proto";
import "ttm/types/v1/common.proto";
import "ttm/types/v1/language.proto";
import "ttm/types/v2/product_code.proto";

message InsuranceProductInfoRequest {
  // Message header
  ttm.types.v1.RequestHeader header = 1;

  // Only respond with the products that are new, modified or deactivated after this
  // timestamp.
  //
  // Timestamps may be used for both off-chain and on-chain operations.
  // For on-chain operations, only seconds are supported, and nanoseconds
  // will be ignored.
  google.protobuf.Timestamp modified_after = 2;

  // Languages to be included in the response for descriptions. Null means all
  // available languages.
  repeated ttm.types.v1.Language languages = 3;

  // Insurance codes
  repeated ttm.types.v2.SupplierProductCode supplier_codes = 4;
}

message InsuranceProductInfoResponse {
  // Message header
  ttm.types.v1.ResponseHeader header = 1;

  // Product list: Insurances
  repeated ttm.services.insurance.v2.PolicyExtendedInfo insurances = 2;
}

// Insurance product info service definition
//
//
//
/// @custom:ttm-service type:product routing:p2p on-chain:false
service InsuranceProductInfoService {
  // Returns product info for insurance
  rpc InsuranceProductInfo(InsuranceProductInfoRequest) returns (InsuranceProductInfoResponse);
}
