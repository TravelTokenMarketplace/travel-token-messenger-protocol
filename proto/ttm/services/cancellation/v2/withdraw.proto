syntax = "proto3";

package ttm.services.cancellation.v2;

import "buf/validate/validate.proto";
import "ttm/services/cancellation/v1/reason.proto";
import "ttm/types/v4/common.proto";
import "ttm/types/v4/evm_transaction.proto";

// Request for withdrawal of an active cancellation proposal
//
message WithdrawCancellationRequest {
  // Request header
  ttm.types.v4.RequestHeader header = 1 [(buf.validate.field).required = true];

  // Booking token ID this request is for
  uint64 token_id = 2;

  // Withdrawal reason
  ttm.services.cancellation.v1.WithdrawalReason reason = 3 [(buf.validate.field).enum = {
    defined_only: true /* Only allow defined enum values */
    not_in: [0] /* Exclude unspecified value */
  }];
}

// Response for withdrawal of an active cancellation proposal
message WithdrawCancellationSuccessResponse {
  // Response header
  ttm.types.v4.SuccessResponseHeader header = 1 [(buf.validate.field).required = true];

  // Transaction ID on-chain for withdrawing the cancellation proposal.
  //
  // This transaction can be verified on-chain to:
  // 1. Prove the exact time of withdrawal
  // 2. Validate the accepted refund amount
  // 3. Prevent disputes about acceptance terms
  ttm.types.v4.EVMTransactionID transaction_id = 2 [(buf.validate.field).required = true];
}

message WithdrawCancellationErrorResponse {
  // Common error response header used in every error response.
  ttm.types.v4.ErrorResponseHeader header = 1 [(buf.validate.field).required = true];
}

message WithdrawCancellationResponse {
  oneof response {
    option (buf.validate.oneof).required = true; // One must be provided
    ttm.services.cancellation.v2.WithdrawCancellationSuccessResponse success_response = 1;
    ttm.services.cancellation.v2.WithdrawCancellationErrorResponse error_response = 2;
  }
}
