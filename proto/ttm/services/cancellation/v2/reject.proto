syntax = "proto3";

package ttm.services.cancellation.v2;

import "buf/validate/validate.proto";
import "ttm/services/cancellation/v1/reason.proto";
import "ttm/types/v4/common.proto";
import "ttm/types/v4/evm_transaction.proto";

// Request for cancellation rejection
//
//
message RejectCancellationRequest {
  // Request Header
  ttm.types.v4.RequestHeader header = 1 [(buf.validate.field).required = true];

  // Booking token ID this request is for
  uint64 token_id = 2;

  // Reason for rejection
  ttm.services.cancellation.v1.RejectionReason reason = 3 [(buf.validate.field).enum = {
    defined_only: true // Only allow defined enum values
    not_in: [0] /* Exclude unspecified value */
  }];
}

// Response for cancellation rejection
message RejectCancellationSuccessResponse {
  // Response Header
  ttm.types.v4.SuccessResponseHeader header = 1 [(buf.validate.field).required = true];

  // Transaction ID on-chain for the cancellation proposal rejection.
  //
  // This transaction can be verified on-chain to:
  // 1. Prove the exact time of the rejection
  // 2. Validate the rejection reason
  // 3. Prevent disputes about the cancellation
  ttm.types.v4.EVMTransactionID transaction_id = 2 [(buf.validate.field).required = true];
}

message RejectCancellationErrorResponse {
  // Common error response header used in every error response.
  ttm.types.v4.ErrorResponseHeader header = 1 [(buf.validate.field).required = true];
}

message RejectCancellationResponse {
  oneof response {
    option (buf.validate.oneof).required = true; // One must be provided
    ttm.services.cancellation.v2.RejectCancellationSuccessResponse success_response = 1;
    ttm.services.cancellation.v2.RejectCancellationErrorResponse error_response = 2;
  }
}
