name: CI

on:
  workflow_dispatch:
    inputs:
      use_branch_name:
        description: "Push to a BSR label named after the branch instead of 'draft'"
        type: boolean
        default: false
  release:
    types: [published]
  push:
    # Only run when there are changes under relevant dirs
    paths:
      - "proto/**"
      - ".github/workflows/**"
      - ".github/actions/**"
      - "scripts/**"
      - "buf.*"
    branches:
      - main
      - dev
  pull_request:
    # Only run when there are changes under relevant dirs
    paths:
      - "proto/**"
      - ".github/workflows/**"
      - ".github/actions/**"
      - "scripts/**"
      - "buf.*"

# Least-privilege default; only the *-diagrams jobs that push to gh-pages
# override with contents: write (see each job below).
permissions:
  contents: read

jobs:
  # Run buf's lint to check for errros
  buf-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4
      - name: Install buf
        run: |
          # Installing buf
          if [ "${{ env.buf_version }}" == "" ]; then
            # Install latest version
            sudo ./scripts/buf-installer.sh
          else
            # Install the defined version
            sudo ./scripts/buf-installer.sh --version=${{ env.buf_version}}
          fi
      - name: Buf lint
        uses: bufbuild/buf-lint-action@v1
        with:
          input: "proto"
  buf-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4
      - name: Install buf
        run: |
          # Installing buf
          if [ "${{ env.buf_version }}" == "" ]; then
            # Install latest version
            sudo ./scripts/buf-installer.sh
          else
            # Install the defined version
            sudo ./scripts/buf-installer.sh --version=${{ env.buf_version}}
          fi
      - name: Buf format
        run: |
          # Run buf format
          buf format proto --diff --exit-code

  # diff check against dev branch to help with the PR reviews
  diff-dev:
    name: Diff against dev to help with the PR reviews
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4
      - name: Run diff against branch
        run: |
          scripts/diff_against_branch.sh dev || true
          echo -e "\n🛟 Note: This diff check against dev branch is for PR review purposes only."
          echo -e "🛟 Any reported differences are informational and not considered errors.\n"

  # Check to catch if proto files were not updated correctly
  # This also does more in-depth checks whether there are services or type files
  # which are not needed any more and creates a "missing_files.txt" file needed
  # by other checks to identify justified missing files.
  # The diff against branch script checks then against the main branch if there
  # are any unjustified breaking changes.
  sanity-checks:
    runs-on: ubuntu-latest
    # TODO(rebrand): re-enable post-merge (origin/main on ttm + BSR baseline exists).
    # When re-enabling, scope it to PRs + dev/main pushes (design §4.5):
    #   if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')) }}
    if: false
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install buf
        run: |
          # Installing buf
          if [ "${{ env.buf_version }}" == "" ]; then
            # Install latest version
            sudo ./scripts/buf-installer.sh
          else
            # Install the defined version
            sudo ./scripts/buf-installer.sh --version=${{ env.buf_version }}
          fi
      - name: Run proto dependency check
        run: scripts/dependency_checker.py --print-graph
      - name: Run diff against branch
        run: scripts/diff_against_branch.sh
      - name: Buf Breaking Check # Run buf breaking against main label on buf.build
        run: scripts/buf-breaking.sh

  # Check if the service tags are set correctly and create a summary for that
  analyze-service-tags:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4
      - name: Run service tag analysis
        run: scripts/analyze-service-tags.sh proto

  # Check if we use FQPN (fully qualified package names) everywhere
  fqpn-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4
      - name: Run proto FQPN check
        run: scripts/fqpn_check.sh

  # ---- Diagram + BSR publish pipeline ----
  # Gated by repo variable PUBLISH_ENABLED so the pipeline stays dormant until
  # GitHub Pages is enabled AND the BSR module buf.build/ttm/messenger-protocol
  # exists. Enable post-merge:  gh variable set PUBLISH_ENABLED --body true
  # Each push is ordered behind its diagrams job so injected .svgz links are live
  # before the label moves. Publish path depends on buf-lint only (not
  # sanity-checks): releases may be intentionally breaking.

  release-diagrams:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push diagrams to gh-pages
    needs: [buf-lint]
    if: ${{ vars.PUBLISH_ENABLED == 'true' && github.event_name == 'release' && startsWith(github.ref_name, 'release-') }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/generate-diagrams
        with:
          name: ${{ github.ref_name }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
  release-push:
    runs-on: ubuntu-latest
    needs: [buf-lint, release-diagrams]
    if: ${{ vars.PUBLISH_ENABLED == 'true' && github.event_name == 'release' && startsWith(github.ref_name, 'release-') }}
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bsr-push
        with:
          name: ${{ github.ref_name }}
          buf_token: ${{ secrets.BUF_BSR_TOKEN }}

  main-diagrams:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push diagrams to gh-pages
    needs: [buf-lint]
    if: ${{ vars.PUBLISH_ENABLED == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/generate-diagrams
        with:
          name: main
          github_token: ${{ secrets.GITHUB_TOKEN }}
  main-push:
    runs-on: ubuntu-latest
    needs: [buf-lint, main-diagrams]
    if: ${{ vars.PUBLISH_ENABLED == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    environment: main
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bsr-push
        with:
          name: main
          buf_token: ${{ secrets.BUF_BSR_TOKEN }}

  dev-diagrams:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push diagrams to gh-pages
    needs: [buf-lint]
    if: ${{ vars.PUBLISH_ENABLED == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/generate-diagrams
        with:
          name: dev
          github_token: ${{ secrets.GITHUB_TOKEN }}
  dev-push:
    runs-on: ubuntu-latest
    needs: [buf-lint, dev-diagrams]
    if: ${{ vars.PUBLISH_ENABLED == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bsr-push
        with:
          name: dev
          buf_token: ${{ secrets.BUF_BSR_TOKEN }}

  preview-diagrams:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push diagrams to gh-pages
    needs: [buf-lint]
    if: ${{ vars.PUBLISH_ENABLED == 'true' && github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/generate-diagrams
        with:
          name: ${{ inputs.use_branch_name && github.ref_name || 'draft' }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
  preview-push:
    runs-on: ubuntu-latest
    needs: [buf-lint, preview-diagrams]
    if: ${{ vars.PUBLISH_ENABLED == 'true' && github.event_name == 'workflow_dispatch' }}
    environment: draft
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bsr-push
        with:
          name: ${{ inputs.use_branch_name && github.ref_name || 'draft' }}
          buf_token: ${{ secrets.BUF_BSR_TOKEN }}

  # Run the diagram-script unit tests (no buf/graphviz needed).
  script-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run diagram script tests
        run: |
          bash scripts/tests/test_generate_svg.sh
          bash scripts/tests/test_diagram_links.sh
