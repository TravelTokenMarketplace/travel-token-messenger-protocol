name: "Generate and publish diagrams"
description: "Generate protodot diagrams and publish them to gh-pages/<name>."
inputs:
  name:
    description: "Publish name (the gh-pages subdirectory)."
    required: true
  github_token:
    description: "Token used to push to the gh-pages branch."
    required: true
runs:
  using: "composite"
  steps:
    - name: Setup Node (for SVGO)
      uses: actions/setup-node@v4
      with:
        node-version: "22"
    - name: Setup Graphviz
      uses: ts-graphviz/setup-graphviz@v1
    - name: Generate diagrams
      shell: bash
      run: |
        wget https://github.com/seamia/protodot/raw/master/binaries/protodot-linux-amd64
        chmod +x protodot-linux-amd64
        mkdir -v -p gen/bin
        mv protodot-linux-amd64 gen/bin/protodot
        export PATH="${PWD}/gen/bin:${PATH}"
        bash scripts/generate_protodot.sh
        find gen/diagrams -type f -name "*.dot" -exec rm -f {} +
    - name: Stage diagrams and assets for Pages
      shell: bash
      run: |
        mkdir -p public
        cp -r gen/diagrams/. public/
        cp -r assets public/assets
    - name: Publish to gh-pages/<name>
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ inputs.github_token }}
        publish_dir: ./public
        destination_dir: ${{ inputs.name }}
        keep_files: true
    - name: Checkout gh-pages
      uses: actions/checkout@v4
      with:
        ref: gh-pages
        path: _ghpages
    - name: Size report + SIZES.md
      shell: bash
      run: |
        bash scripts/gh_pages_size_report.sh _ghpages --sizes-md _ghpages/SIZES.md \
          | tee -a "$GITHUB_STEP_SUMMARY"
    - name: Commit gh-pages root files (index.html + SIZES.md)
      shell: bash
      working-directory: _ghpages
      run: |
        # index.html is the repo-tracked landing page (source of truth); refresh
        # the published copy. SIZES.md was written by the size-report step above.
        cp "${GITHUB_WORKSPACE}/pages/index.html" index.html
        git config user.name  "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add index.html SIZES.md
        if git diff --cached --quiet; then
          echo "gh-pages root files unchanged; nothing to commit."
        else
          git commit -m "chore(pages): update root index.html + SIZES.md [skip ci]"
          # peaceiris already pushed to gh-pages earlier in this run, and another
          # publish run may push between our checkout and now. Rebase + retry so a
          # concurrent push doesn't fail the job on a non-fast-forward.
          pushed=false
          for attempt in 1 2 3; do
            if git push origin gh-pages; then pushed=true; break; fi
            echo "push rejected (attempt ${attempt}); rebasing on origin/gh-pages"
            git fetch origin gh-pages
            git rebase origin/gh-pages
          done
          [ "$pushed" = true ] || { echo "::error::could not push gh-pages root files after 3 attempts"; exit 1; }
        fi
