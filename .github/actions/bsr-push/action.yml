name: "Push proto to buf.build"
description: "Inject diagram links then push proto to buf.build under a label."
inputs:
  name:
    description: "BSR label (and diagram-link subdirectory) to publish under."
    required: true
  buf_token:
    description: "buf.build API token."
    required: true
  buf_version:
    description: "Pinned buf version to install. Keep in step with BUF_VERSION in ci.yaml."
    required: false
    default: "v1.47.2"
runs:
  using: "composite"
  steps:
    - name: Install buf
      shell: bash
      # Pinned: this job holds the BSR publish token, so it must not run
      # whatever the newest buf release happens to be on the day.
      run: sudo ./scripts/buf-installer.sh --version="${{ inputs.buf_version }}" --do-not-validate
    - name: Inject and verify diagram links
      shell: bash
      run: |
        # Throwaway checkout; the injected links are NOT committed.
        scripts/insert_diagram_link.sh "${{ inputs.name }}"
        scripts/verify_diagram_links.sh "${{ inputs.name }}"
    - name: Push to buf.build
      shell: bash
      env:
        BUF_TOKEN: ${{ inputs.buf_token }}
      run: buf push --label "${{ inputs.name }}"
